name = "nightryder"
type = "javascript"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "nightryder-staging"
vars = { ENVIRONMENT = "staging" }

[build]
  command = "npm run build"

[deploy]
  command = "npm start"

[triggers]
  crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "GITHUB_TOKENS"
id = "YOUR_KV_NAMESPACE_ID"

[bindings]
  durable_objects = [{ binding = "WORKFLOW", class_name = "Workflow" }]